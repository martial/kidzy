<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explorations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A44}a:hover{color:#1F2A44}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
figure img{display:block;width:100%;border-radius:18px}
figcaption{font-size:18px;font-weight:700;line-height:1.3;color:#E6E8EF}
figcaption b{color:#FFFFFF;font-weight:800}
</style>
</helmet>
<div style="width: 1300px; height: 1040px; box-sizing: border-box; padding: 36px; background: #1C1D22; font-family: 'Baloo 2', sans-serif; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 32px">
  <figure>
    <img src="/_blob/65539220ce1123b3833e6371d79e4dec" alt="Round 1: a toy shelf, floating bubbles, and pop cards">
    <figcaption><b>Round 1.</b> Shelf, bubbles, cards. The shelf felt warmest; the bubbles shrank the toys; the cards looked like any app.</figcaption>
  </figure>
  <figure>
    <img src="/_blob/aec5ea8e5e99041b649dc08732e9e53d" alt="Round 2: the cubby cabinet on sunny, sky and wooden walls">
    <figcaption><b>Round 2.</b> One cubby per toy. Sunny with coloured cubbies won: each toy gets a colour a child can remember.</figcaption>
  </figure>
  <figure>
    <img src="/_blob/eee0b57e30fe1ecfadf057b7cc89c887" alt="Round 3: garland and floor added; locked toys with a badge or behind glass">
    <figcaption><b>Round 3.</b> Garland, floor, feet. For locked toys the yellow badge beat the glass door, which washed the toys out.</figcaption>
  </figure>
  <figure>
    <img src="/_blob/cf6187886e1881756b7ebc1297ba4511" alt="Round 4: three icons, the parrot, a toy box and a cubby">
    <figcaption><b>Round 4.</b> Icons. The parrot stays readable down to 29 pt; the toy box and the cubby go muddy when small.</figcaption>
  </figure>
</div>
</x-dc>

</html>
