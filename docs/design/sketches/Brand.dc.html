<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand kit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A44}a:hover{color:#1F2A44}
.wall{background:radial-gradient(120% 55% at 50% 0%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%),radial-gradient(circle at 14px 14px,rgba(255,255,255,.32) 2.6px,transparent 3.6px) 0 0/32px 32px,linear-gradient(180deg,#FFC530,#FFD95C 72%)}
.sw{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:#1F2A44}
.sw span:first-child{display:block;height:44px;border-radius:14px}
.h{margin:0;font-size:14px;font-weight:800;color:#4A5878}
</style>
</helmet>
<div style="width: 900px; height: 560px; display: flex; background: #FFFFFF; font-family: 'Baloo 2', sans-serif; color: #1F2A44">
  <div class="wall" style="width: 360px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
    <div style="font-size: 72px; font-weight: 800; line-height: .9; letter-spacing: -1px; color: #FFFFFF; text-shadow: 0 3px 0 #F59B00, 0 6px 0 #E58600, 0 8px 0 #D27800, 0 14px 18px rgba(150,70,0,.35)">Sketches</div>
    <svg aria-hidden="true" width="230" height="18" viewBox="0 0 250 18"><path d="M6 11 C40 3 70 15 104 8 S170 4 200 11 S236 12 244 6" fill="none" stroke="#FF5E57" stroke-width="5" stroke-linecap="round"/></svg>
    <div style="margin-top: 4px; transform: rotate(-4deg); padding: 3px 18px 0; border-radius: 999px; background: #F04A43; box-shadow: 0 5px 0 #C8322C; color: #FFFFFF; font-size: 26px; font-weight: 800; line-height: 1.25">for kids!</div>
  </div>
  <div style="flex: 1; padding: 32px 36px; display: flex; flex-direction: column; gap: 18px">
    <p class="h">Colours</p>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: -8px">
      <div class="sw"><span style="background: #FFC530"></span><span>Sun</span><span style="color: #4A5878">FFC530</span></div>
      <div class="sw"><span style="background: #FF9F12"></span><span>Tangerine</span><span style="color: #4A5878">FF9F12</span></div>
      <div class="sw"><span style="background: #F04A43"></span><span>Coral</span><span style="color: #4A5878">F04A43</span></div>
      <div class="sw"><span style="background: #1F2A44"></span><span>Ink</span><span style="color: #4A5878">1F2A44</span></div>
      <div class="sw"><span style="background: linear-gradient(#2A3768, #3D57A6)"></span><span>Night</span><span style="color: #4A5878">2A3768</span></div>
      <div class="sw"><span style="background: #F4F0FA; box-shadow: inset 0 0 0 2px #E6DFF0"></span><span>Cabinet</span><span style="color: #4A5878">F4F0FA</span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
      <div class="sw"><span style="background: #8FD3FF"></span><span>Sea</span></div>
      <div class="sw"><span style="background: #FFA2C0"></span><span>Paint</span></div>
      <div class="sw"><span style="background: #B6A2FF"></span><span>Shapes</span></div>
      <div class="sw"><span style="background: #8FDB7C"></span><span>Animals</span></div>
      <div class="sw"><span style="background: #79D9CC"></span><span>Guitar</span></div>
      <div class="sw"><span style="background: #FFD45A"></span><span>Parrot</span></div>
    </div>
    <p class="h" style="margin-top: 4px">Type: Baloo 2</p>
    <div style="display: flex; align-items: baseline; gap: 22px; margin-top: -10px">
      <span style="font-size: 40px; font-weight: 800; line-height: 1">Aa 800</span>
      <span style="font-size: 26px; font-weight: 700">Body 700</span>
      <span style="font-size: 17px; font-weight: 600; color: #4A5878">Small 600</span>
    </div>
    <p class="h" style="margin-top: 4px">Pieces</p>
    <div style="display: flex; align-items: center; gap: 18px; margin-top: -6px">
      <span style="display: inline-flex; align-items: center; height: 52px; padding: 0 22px; border-radius: 20px; background: linear-gradient(#FF6A5E, #F04A43); box-shadow: 0 6px 0 #C8322C; color: #FFFFFF; font-size: 20px; font-weight: 800">Unlock</span>
      <span aria-label="Home button" style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(#FFFFFF, #F1F4FF); box-shadow: 0 6px 0 #C9D3EC"><svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.2 11.3 11 4.4a1.5 1.5 0 0 1 2 0l7.8 6.9c.6.5.2 1.5-.6 1.5H19v6.7c0 .8-.7 1.5-1.5 1.5h-3.2v-5h-4.6v5H6.5c-.8 0-1.5-.7-1.5-1.5v-6.7h-1.2c-.8 0-1.2-1-.6-1.5Z" fill="#F04A43"/></svg></span>
      <span aria-label="Locked toy badge" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(#FFE27A, #FFC21F); box-shadow: 0 4px 0 #D99A00"><svg width="18" height="18" viewBox="0 0 24 24" fill="#6B4300" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h.5A2.5 2.5 0 0 1 20 12.5v7A2.5 2.5 0 0 1 17.5 22h-11A2.5 2.5 0 0 1 4 19.5v-7A2.5 2.5 0 0 1 6.5 10H7Zm2.5 0h5V8a2.5 2.5 0 0 0-5 0v2Z"/></svg></span>
      <span style="display: block; width: 76px; height: 76px; border-radius: 20px; background: linear-gradient(#8FD3FF, #C6EAFF); box-shadow: inset 0 14px 14px -10px rgba(60,20,80,.28), 0 0 0 7px #FFFFFF, 0 0 0 9px #E6DFF0"></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
