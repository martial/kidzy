# XcodeGen definition for both apps. Regenerate ios/Kidzy.xcodeproj with `make xcodeproj` after editing.
# Kidzy (the video player) and SketchesForKids (the toys alone) compile ios/Toys as plain sources.
name: Kidzy
options:
  bundleIdPrefix: com.screenclub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  # Toy audio (MIT): one AudioKit engine shared by every toy, see Toys/Sources/Kit/ToyAudio.swift
  AudioKit:
    url: https://github.com/AudioKit/AudioKit
    from: 5.7.2
  SoundpipeAudioKit:
    url: https://github.com/AudioKit/SoundpipeAudioKit
    from: 5.7.4
  AudioKitEX:
    url: https://github.com/AudioKit/AudioKitEX
    from: 5.7.0
  DunneAudioKit:
    url: https://github.com/AudioKit/DunneAudioKit
    from: 5.6.2
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Kidzy:
    type: application
    platform: iOS
    sources:
      - path: Kidzy/Sources
      - path: Kidzy/Shared
      - path: Toys/Sources
      - path: Toys/Resources
        buildPhase: resources
      - path: Toys/Toys.xcstrings
      - path: Kidzy/Assets.xcassets
      - path: Kidzy/PrivacyInfo.xcprivacy
    dependencies:
      - package: AudioKit
      - package: SoundpipeAudioKit
      - package: AudioKitEX
      - package: DunneAudioKit
    configFiles:
      Debug: Kidzy/Config/App.xcconfig
      Release: Kidzy/Config/App.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Kidzy/Config/Info.plist
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - KidzyUITests
  SketchesForKids:
    type: application
    platform: iOS
    sources:
      - path: SketchesForKids/Sources
      - path: SketchesForKids/Resources
        buildPhase: resources
      - path: Kidzy/Shared/Toys
      - path: Toys/Sources
      - path: Toys/Resources
        buildPhase: resources
      - path: Toys/Toys.xcstrings
      - path: SketchesForKids/Assets.xcassets
      - path: SketchesForKids/PrivacyInfo.xcprivacy
      - path: SketchesForKids/Localizable.xcstrings
      - path: SketchesForKids/InfoPlist.xcstrings
      - path: SketchesForKids/Store.storekit
        buildPhase: none
    dependencies:
      - package: AudioKit
      - package: SoundpipeAudioKit
      - package: AudioKitEX
      - package: DunneAudioKit
    configFiles:
      Debug: SketchesForKids/Config/App.xcconfig
      Release: SketchesForKids/Config/App.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SketchesForKids/Config/Info.plist
        ENABLE_PREVIEWS: YES
    scheme:
      storeKitConfiguration: SketchesForKids/Store.storekit
      testTargets:
        - SketchesForKidsTests
        - SketchesForKidsUITests
  SketchesForKidsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SketchesForKids/Tests
      - path: SketchesForKids/Store.storekit
    dependencies:
      - target: SketchesForKids
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KidzyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Kidzy/UITests
    dependencies:
      - target: Kidzy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  SketchesForKidsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SketchesForKids/UITests
    dependencies:
      - target: SketchesForKids
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
